<svg xmlns="http://www.w3.org/2000/svg" width="950" height="570" viewBox="0 0 950 570" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Campaign decision funnel</title>
  <desc id="chart-description">Bars show the reduction from all known customers to the high-value inactive segment and the prioritised campaign list.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="90.0" y="48.0" font-size="19px" text-anchor="start" font-weight="500" fill="#17202a">The campaign decision narrows the customer base to 300 testable targets</text><line x1="90" y1="480.0" x2="880" y2="480.0" stroke="#d9dee7" stroke-width="1"/><text x="80.0" y="484.0" font-size="11px" text-anchor="end" font-weight="400" fill="#5b6675">0</text><line x1="90" y1="385.0" x2="880" y2="385.0" stroke="#d9dee7" stroke-width="1"/><text x="80.0" y="389.0" font-size="11px" text-anchor="end" font-weight="400" fill="#5b6675">1k</text><line x1="90" y1="290.0" x2="880" y2="290.0" stroke="#d9dee7" stroke-width="1"/><text x="80.0" y="294.0" font-size="11px" text-anchor="end" font-weight="400" fill="#5b6675">3k</text><line x1="90" y1="195.0" x2="880" y2="195.0" stroke="#d9dee7" stroke-width="1"/><text x="80.0" y="199.0" font-size="11px" text-anchor="end" font-weight="400" fill="#5b6675">4k</text><line x1="90" y1="100.0" x2="880" y2="100.0" stroke="#d9dee7" stroke-width="1"/><text x="80.0" y="104.0" font-size="11px" text-anchor="end" font-weight="400" fill="#5b6675">6k</text><rect x="146.7" y="100.0" width="150" height="380.0" rx="4" fill="#94a3b8"/><text x="221.7" y="90.0" font-size="14px" text-anchor="middle" font-weight="500" fill="#17202a">5,878</text><text x="221.7" y="505.0" font-size="12px" text-anchor="middle" font-weight="400" fill="#334155">All known</text><text x="221.7" y="522.0" font-size="12px" text-anchor="middle" font-weight="400" fill="#334155">customers</text><rect x="410.0" y="454.3" width="150" height="25.7" rx="4" fill="#c2410c"/><text x="485.0" y="444.3" font-size="14px" text-anchor="middle" font-weight="500" fill="#17202a">397</text><text x="485.0" y="505.0" font-size="12px" text-anchor="middle" font-weight="400" fill="#334155">At-risk high-value</text><text x="485.0" y="522.0" font-size="12px" text-anchor="middle" font-weight="400" fill="#334155">customers</text><rect x="673.3" y="460.6" width="150" height="19.4" rx="4" fill="#2563eb"/><text x="748.3" y="450.6" font-size="14px" text-anchor="middle" font-weight="500" fill="#17202a">300</text><text x="748.3" y="505.0" font-size="12px" text-anchor="middle" font-weight="400" fill="#334155">Prioritised target</text><text x="748.3" y="522.0" font-size="12px" text-anchor="middle" font-weight="400" fill="#334155">list</text></g>
</svg>
