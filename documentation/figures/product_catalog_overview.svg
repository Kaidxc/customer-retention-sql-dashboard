<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Product catalogue overview</title>
  <desc id="chart-description">Business snapshot showing total product range, stable core products, high-value products, dormant products and revenue concentration.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="55.0" y="48.0" font-size="20px" text-anchor="start" font-weight="500" fill="#17202a">Product range snapshot: many products, smaller core of stronger sellers</text><text x="55.0" y="76.0" font-size="13px" text-anchor="start" font-weight="400" fill="#5b6675">Management takeaway: plan the stable core carefully, and review low-selling items with clear rules.</text><rect x="55" y="115" width="250" height="145" rx="6" fill="#ffffff" stroke="#d9dee7" stroke-width="1"/><text x="77.0" y="145.0" font-size="13px" text-anchor="start" font-weight="400" fill="#5b6675">Total range</text><text x="77.0" y="193.0" font-size="32px" text-anchor="start" font-weight="700" fill="#2563eb">4,626</text><text x="77.0" y="227.0" font-size="12px" text-anchor="start" font-weight="400" fill="#334155">merchandise products</text><text x="77.0" y="247.0" font-size="12px" text-anchor="start" font-weight="400" fill="#334155">included in analysis</text><rect x="325" y="115" width="250" height="145" rx="6" fill="#ffffff" stroke="#d9dee7" stroke-width="1"/><text x="347.0" y="145.0" font-size="13px" text-anchor="start" font-weight="400" fill="#5b6675">Stable core</text><text x="347.0" y="193.0" font-size="32px" text-anchor="start" font-weight="700" fill="#0f766e">1,464</text><text x="347.0" y="227.0" font-size="12px" text-anchor="start" font-weight="400" fill="#334155">products sold in</text><text x="347.0" y="247.0" font-size="12px" text-anchor="start" font-weight="400" fill="#334155">19-25 months</text><rect x="595" y="115" width="250" height="145" rx="6" fill="#ffffff" stroke="#d9dee7" stroke-width="1"/><text x="617.0" y="145.0" font-size="13px" text-anchor="start" font-weight="400" fill="#5b6675">High-value items</text><text x="617.0" y="193.0" font-size="32px" text-anchor="start" font-weight="700" fill="#c2410c">28</text><text x="617.0" y="227.0" font-size="12px" text-anchor="start" font-weight="400" fill="#334155">products generated</text><text x="617.0" y="247.0" font-size="12px" text-anchor="start" font-weight="400" fill="#334155">GBP 50k+ revenue</text><rect x="865" y="115" width="250" height="145" rx="6" fill="#ffffff" stroke="#d9dee7" stroke-width="1"/><text x="887.0" y="145.0" font-size="13px" text-anchor="start" font-weight="400" fill="#5b6675">Low-selling review</text><text x="887.0" y="193.0" font-size="32px" text-anchor="start" font-weight="700" fill="#7c3aed">1,004</text><text x="887.0" y="227.0" font-size="12px" text-anchor="start" font-weight="400" fill="#334155">products had no sale</text><text x="887.0" y="247.0" font-size="12px" text-anchor="start" font-weight="400" fill="#334155">for 365+ days</text><rect x="55" y="290" width="1090" height="145" rx="6" fill="#ffffff" stroke="#d9dee7" stroke-width="1"/><text x="85.0" y="318.0" font-size="15px" text-anchor="start" font-weight="500" fill="#17202a">Revenue concentration</text><rect x="85" y="330" width="1030" height="46" rx="5" fill="#eef2f7"/><rect x="85.0" y="330" width="307.0" height="46" rx="5" fill="#2563eb"/><text x="238.5" y="360.0" font-size="13px" text-anchor="middle" font-weight="500" fill="#ffffff">30%</text><rect x="392.0" y="330" width="352.2" height="46" rx="5" fill="#0f766e"/><text x="568.1" y="360.0" font-size="13px" text-anchor="middle" font-weight="500" fill="#ffffff">34%</text><rect x="744.2" y="330" width="370.8" height="46" rx="5" fill="#94a3b8"/><text x="929.6" y="360.0" font-size="13px" text-anchor="middle" font-weight="500" fill="#17202a">36%</text><rect x="85" y="393" width="13" height="13" rx="2" fill="#2563eb"/><text x="105.0" y="405.0" font-size="12px" text-anchor="start" font-weight="400" fill="#17202a">Top 100 products: 29.8%</text><rect x="390" y="393" width="13" height="13" rx="2" fill="#0f766e"/><text x="410.0" y="405.0" font-size="12px" text-anchor="start" font-weight="400" fill="#17202a">Products 101-500: 34.2%</text><rect x="695" y="393" width="13" height="13" rx="2" fill="#94a3b8"/><text x="715.0" y="405.0" font-size="12px" text-anchor="start" font-weight="400" fill="#17202a">Remaining products: 36.0%</text><rect x="55" y="475" width="1090" height="145" rx="6" fill="#ffffff" stroke="#d9dee7" stroke-width="1"/><text x="85.0" y="505.0" font-size="15px" text-anchor="start" font-weight="500" fill="#17202a">How to use this insight</text><text x="85.0" y="545.0" font-size="14px" text-anchor="start" font-weight="500" fill="#17202a">Plan individually</text><text x="85.0" y="575.0" font-size="12px" text-anchor="start" font-weight="400" fill="#334155">Stable, high-revenue products are suitable</text><text x="85.0" y="595.0" font-size="12px" text-anchor="start" font-weight="400" fill="#334155">for stock and forecast review.</text><text x="430.0" y="545.0" font-size="14px" text-anchor="start" font-weight="500" fill="#17202a">Review lifecycle</text><text x="430.0" y="575.0" font-size="12px" text-anchor="start" font-weight="400" fill="#334155">Products with no recent sale need checks for</text><text x="430.0" y="595.0" font-size="12px" text-anchor="start" font-weight="400" fill="#334155">discontinuation, seasonality or stockout.</text><text x="775.0" y="545.0" font-size="14px" text-anchor="start" font-weight="500" fill="#17202a">Manage by rules</text><text x="775.0" y="575.0" font-size="12px" text-anchor="start" font-weight="400" fill="#334155">Low-selling items should use category or</text><text x="775.0" y="595.0" font-size="12px" text-anchor="start" font-weight="400" fill="#334155">lifecycle rules rather than manual planning.</text></g>
</svg>
