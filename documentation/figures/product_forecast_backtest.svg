<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Product forecast backtest</title>
  <desc id="chart-description">Validation summary for the four-quarter moving average product forecast baseline.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="55.0" y="45.0" font-size="20px" text-anchor="start" font-weight="500" fill="#17202a">Forecast validation: where the simple baseline is more reliable</text><text x="55.0" y="73.0" font-size="13px" text-anchor="start" font-weight="400" fill="#5b6675">Backtesting compares historical forecasts with the next quarter that actually happened. Lower error means the product is easier to plan with this baseline.</text><rect x="55" y="102" width="315" height="92" rx="6" fill="#ffffff" stroke="#d9dee7" stroke-width="1"/><text x="73.0" y="130.0" font-size="12px" text-anchor="start" font-weight="400" fill="#5b6675">Validation window</text><text x="73.0" y="160.0" font-size="22px" text-anchor="start" font-weight="700" fill="#2563eb">5 quarters</text><text x="73.0" y="180.0" font-size="11px" text-anchor="start" font-weight="400" fill="#334155">tested per selected product</text><rect x="387" y="102" width="315" height="92" rx="6" fill="#ffffff" stroke="#d9dee7" stroke-width="1"/><text x="405.0" y="130.0" font-size="12px" text-anchor="start" font-weight="400" fill="#5b6675">Median revenue error</text><text x="405.0" y="160.0" font-size="22px" text-anchor="start" font-weight="700" fill="#0f766e">47.9%</text><text x="405.0" y="180.0" font-size="11px" text-anchor="start" font-weight="400" fill="#334155">MAPE across selected products</text><rect x="719" y="102" width="315" height="92" rx="6" fill="#ffffff" stroke="#d9dee7" stroke-width="1"/><text x="737.0" y="130.0" font-size="12px" text-anchor="start" font-weight="400" fill="#5b6675">Median GBP error</text><text x="737.0" y="160.0" font-size="22px" text-anchor="start" font-weight="700" fill="#c2410c">GBP 3,767</text><text x="737.0" y="180.0" font-size="11px" text-anchor="start" font-weight="400" fill="#334155">MAE per product per quarter</text><text x="360.0" y="228.0" font-size="15px" text-anchor="start" font-weight="500" fill="#17202a">Lowest-error products in backtest</text><text x="345.0" y="276.0" font-size="12px" text-anchor="end" font-weight="400" fill="#17202a">22423 | REGENCY CAKESTAND 3 TIER</text><rect x="360" y="258" width="670" height="24" rx="4" fill="#eef2f7"/><rect x="360" y="258" width="670.0" height="24" rx="4" fill="#0f766e"/><text x="1042.0" y="276.0" font-size="12px" text-anchor="start" font-weight="400" fill="#17202a">47.3% | GBP 19,563</text><text x="345.0" y="310.0" font-size="12px" text-anchor="end" font-weight="400" fill="#17202a">20685 | RED SPOTTY COIR DOORMAT</text><rect x="360" y="292" width="670" height="24" rx="4" fill="#eef2f7"/><rect x="360" y="292" width="592.0" height="24" rx="4" fill="#0f766e"/><text x="964.0" y="310.0" font-size="12px" text-anchor="start" font-weight="400" fill="#17202a">41.8% | GBP 2,339</text><text x="345.0" y="344.0" font-size="12px" text-anchor="end" font-weight="400" fill="#17202a">84879 | ASSORTED COLOUR BIRD ORNAMENT</text><rect x="360" y="326" width="670" height="24" rx="4" fill="#eef2f7"/><rect x="360" y="326" width="587.6" height="24" rx="4" fill="#0f766e"/><text x="959.6" y="344.0" font-size="12px" text-anchor="start" font-weight="400" fill="#17202a">41.5% | GBP 6,833</text><text x="345.0" y="378.0" font-size="12px" text-anchor="end" font-weight="400" fill="#17202a">85123A | WHITE HANGING HEART T-LIGHT HOLDER</text><rect x="360" y="360" width="670" height="24" rx="4" fill="#eef2f7"/><rect x="360" y="360" width="582.2" height="24" rx="4" fill="#0f766e"/><text x="954.2" y="378.0" font-size="12px" text-anchor="start" font-weight="400" fill="#17202a">41.1% | GBP 10,637</text><text x="345.0" y="412.0" font-size="12px" text-anchor="end" font-weight="400" fill="#17202a">22197 | SMALL POPCORN HOLDER</text><rect x="360" y="394" width="670" height="24" rx="4" fill="#eef2f7"/><rect x="360" y="394" width="477.6" height="24" rx="4" fill="#0f766e"/><text x="849.6" y="412.0" font-size="12px" text-anchor="start" font-weight="400" fill="#17202a">33.7% | GBP 3,619</text><text x="345.0" y="446.0"